# Posts the summary of ../report as a pull request comment, updating its
# earlier one. Use it in a workflow triggered by `workflow_run` of the workflow
# that ran ../report: pull requests from forks only get a read-only token, a
# workflow_run workflow gets a writable one. It never checks out or runs pull
# request code; it only reads the uploaded summary.
#
# Needs `actions: read` and `pull-requests: write`.
name: Coverage comment
description: Post the coverage report of a pull request run as a comment

inputs:
  artifact-name:
    description: Name the report action uploaded the pull request's report under.
    default: coverage-report
  github-token:
    description: Token to download the report and write the comment.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check trigger
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        [[ "$EVENT" == workflow_run ]] \
          || { echo "::error::Use this action in a workflow_run workflow, not $EVENT"; exit 1; }

    - name: Download coverage report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/coverage-report
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.github-token }}

    - name: Check pull request number
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        REPORT: ${{ runner.temp }}/coverage-report
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      # The number comes from the pull request's own run, which could write
      # anything there. Only accept it if that pull request is the one that was
      # tested, so a run cannot comment on other pull requests. Pull requests
      # from several forks can share a commit: match repository and branch too.
      run: |
        pr=$(cat "$REPORT/pr_number")
        [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number: $pr"; exit 1; }
        gh api "repos/$REPO/pulls/$pr" \
          | jq -e --arg repo "$HEAD_REPO" --arg ref "$HEAD_BRANCH" --arg sha "$HEAD_SHA" '
              .head.repo.full_name == $repo and .head.ref == $ref and .head.sha == $sha
            ' > /dev/null \
          || { echo "::error::PR #$pr is not $HEAD_REPO:$HEAD_BRANCH at $HEAD_SHA"; exit 1; }
        echo "number=$pr" >> "$GITHUB_OUTPUT"

    - name: Find existing coverage comment
      id: find
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ steps.pr.outputs.number }}
        comment-author: github-actions[bot]
        # Must match COMMENT_MARKER in coverage_report/src/markdown.py.
        body-includes: <!-- score-coverage-report -->

    - name: Create or update coverage comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        token: ${{ inputs.github-token }}
        comment-id: ${{ steps.find.outputs.comment-id }}
        issue-number: ${{ steps.pr.outputs.number }}
        body-path: ${{ runner.temp }}/coverage-report/summary.md
        # The default, append, would stack every push's summary in one comment.
        edit-mode: replace
