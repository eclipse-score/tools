[project]
name = "coverage-report"
version = "0.1.0"
description = "Merge LCOV reports and compare their coverage with a baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
score-coverage-report = "coverage_report.src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "__main__.py", "src"]
sources = { "" = "coverage_report" }
dev-mode-dirs = [".."]
