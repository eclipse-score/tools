[project]
name = "rust-dependency-audit"
version = "0.1.0"
description = "Repository dependency audit tool to identify Rust crates usage across repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
score-rust-dependency-audit = "rust_dependency_audit.src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "src"]
sources = { "" = "rust_dependency_audit" }
dev-mode-dirs = [".."]
