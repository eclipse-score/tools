[project]
name = "repo-cache"
version = "0.1.0"
description = "Local, disposable Git checkouts of every repository in a GitHub organization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
score-repo-cache = "repo_cache.src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "src"]
sources = { "" = "repo_cache" }
dev-mode-dirs = [".."]
