[project]
name = "tools"
version = "0.1.0"
description = "Gathering of different small tools used throughout S-CORE"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "cr_checker",
    "monorepo_release",
    "repo_cache",
    "repo_policy_sync",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cr-checker",
    "monorepo-release",
    "pyfakefs>=6.1.6",
    "pyrefly==1.5.0",
    "pytest>=9.1.1",
    "repo-cache",
    "repo-policy-sync",
    "ruff==0.15.10",
]

[tool.uv.sources]
cr-checker = { workspace = true }
monorepo-release = { workspace = true }
repo-cache = { workspace = true }
repo-policy-sync = { workspace = true }

[tool.pytest.ini_options]

addopts = "--import-mode=importlib"

norecursedirs = [
    ".*",        # hidden folders like .git, .venv, .cache, etc.
    "bazel-*",   # Bazel output folders
    "score_pytest/tests/integration_tests",  # needs Bazel, see its MODULE.bazel
]

[tool.pyrefly]
preset = "strict"
# FIXME: Prune the baseline as type errors are fixed and remove it when empty.
baseline = "pyrefly-baseline-FIXME.json"
baseline-matching-mode = "column-ordered"
baseline-format = "minimal"
# Bazel provides the Python import paths for these integration tests.
project-excludes = ["score_pytest/tests/integration_tests/**"]
