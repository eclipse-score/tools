[project]
name = "repo-policy-sync"
version = "0.1.0"
description = "Organization-wide repository policy synchronization for S-CORE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.0.0",
    "pyyaml>=6.0",
    "repo-cache",
]

[project.scripts]
score-repo-policy-sync = "repo_policy_sync.src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "src", "policies", "templates"]
sources = { "" = "repo_policy_sync" }
dev-mode-dirs = [".."]

[tool.uv.sources]
repo-cache = { workspace = true }
