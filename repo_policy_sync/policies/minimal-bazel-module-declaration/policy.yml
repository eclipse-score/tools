title: "chore(bazel): use a minimal module declaration"
legacy_names:
  - bazel.minimal-module-declaration
  - bazel.module-one-line
description: Keep the Bazel module declaration limited to its repository-owned name.

when:
  file_exists: MODULE.bazel

ensure:
  - type: replace_regex
    path: MODULE.bazel
    pattern: '(?m)^[ \t]*module\((?=[^)]*\bname\s*=\s*"([^"]+)")(?=[^)]*(?:\bversion\s*=|\bcompatibility_level\s*=))[^)]*\)'
    replacement: 'module(name = "\1")'
    rationale: Remove module metadata that should be derived by the Bazel Registry.
