title: "chore(docs): update score_docs_as_code gitignore configuration"
legacy_names:
  - docs-as-code-legacy-configuration-removal
  - score-docs-as-code.gitignore-and-cleanup
  - score-docs-as-code.legacy-documentation-cleanup
description: >
  Update the `.gitignore` configuration for `score_docs_as_code`.

when:
  bazel:
    direct_module_dependencies:
      - score_docs_as_code

ensure:
  - type: ensure_line
    path: .gitignore
    line: _build
    replace_line_globs:
      - "*_build*"
  - type: ensure_line
    path: .gitignore
    line: ubproject.toml
    replace_line_globs:
      - "*ubproject.toml*"
  - type: remove_file
    path: docs/ubproject.toml
  - type: remove_file
    path: ubproject.toml
