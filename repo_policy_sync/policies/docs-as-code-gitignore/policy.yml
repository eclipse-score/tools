title: "chore(docs): update score_docs_as_code gitignore configuration"
legacy_names:
  - docs-as-code-legacy-configuration-removal
  - score-docs-as-code.gitignore-and-cleanup
  - score-docs-as-code.legacy-documentation-cleanup
description: >
  Update the `.gitignore` configuration for `score_docs_as_code`.

when:
  bazel:
    direct_module_dependencies:
      - score_docs_as_code

ensure:
  - type: sync_managed_block
    path: .gitignore
    source: docs-as-code-build-artifacts.gitignore
    marker: docs-as-code build artifacts
    replace_lines:
      - "# docs build artifacts"
    replace_line_globs:
      - "*_build*"
      - "*ubproject.toml*"
    rationale: Keep documentation build artifacts together in one managed block.
  - type: remove_file
    path: docs/ubproject.toml
  - type: remove_file
    path: ubproject.toml
