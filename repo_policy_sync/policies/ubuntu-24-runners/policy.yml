title: "chore(ci): use Ubuntu 24.04 GitHub Actions runners"
description: Replace floating Ubuntu runner labels in top-level GitHub workflow files with the supported Ubuntu 24.04 label.

ensure:
  - type: replace_regex
    path: .github/workflows/*.yml
    pattern: ubuntu-latest
    replacement: ubuntu-24.04
    rationale: Pin workflow runners to Ubuntu 24.04 for consistent CI environments.
  - type: replace_regex
    path: .github/workflows/*.yaml
    pattern: ubuntu-latest
    replacement: ubuntu-24.04
    rationale: Pin workflow runners to Ubuntu 24.04 for consistent CI environments.
