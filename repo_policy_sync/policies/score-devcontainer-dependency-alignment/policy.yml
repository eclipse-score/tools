title: "chore(devcontainer): declare SCORE devcontainer dependency"
description: |
  Declare the SCORE devcontainer as a direct Bazel dependency using the
  repository's Dockerfile image version.
values:
  devcontainer_version:
    type: dockerfile_image_version
    dockerfile: .devcontainer/Dockerfile
    image: ghcr.io/eclipse-score/devcontainer
when:
  file_exists: MODULE.bazel
  value_exists: devcontainer_version
ensure:
  - type: ensure_bazel_dependency
    module_file: MODULE.bazel
    module_name: score_devcontainer
    version:
      ref: devcontainer_version
    rationale: Declare the SCORE devcontainer as a direct Bazel dependency.
after_apply:
  - command: [bazel, mod, deps]
    when_file_exists: MODULE.bazel.lock
    when_path_changed: MODULE.bazel
    description: Regenerate MODULE.bazel.lock with `bazel mod deps`.
