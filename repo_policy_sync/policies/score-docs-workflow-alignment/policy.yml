title: "chore(ci): align SCORE documentation workflows"
description: |
  Use the shared SCORE documentation build and publish workflows as documented
  by cicd-workflows. Keep repository-specific workflow refs when they are at
  least the policy baseline or cannot be safely ordered.
when:
  file_contains_any:
    - path: .github/workflows/*.yml
      pattern: '(?m)^\s*uses:\s+eclipse-score/cicd-workflows/\.github/workflows/docs\.yml@'
    - path: .github/workflows/*.yaml
      pattern: '(?m)^\s*uses:\s+eclipse-score/cicd-workflows/\.github/workflows/docs\.yml@'
ensure:
  - type: synchronize_workflow
    source: docs.yml
    reusable_workflow: eclipse-score/cicd-workflows/.github/workflows/docs.yml
    minimum_version: 0.0.3
    required_triggers:
      - pull_request
      - push
      - merge_group
      - release
      - workflow_dispatch
    workflow_run:
      path: .github/workflows/docs-publish.yml
      source: docs-publish.yml
    rationale: Use the documented unprivileged documentation build workflow.
