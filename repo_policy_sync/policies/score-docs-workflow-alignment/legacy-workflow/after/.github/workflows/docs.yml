name: Documentation
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo lint
  build-docs:
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67
    with:
      bazel-target: "--lockfile_mode=error //:docs"
      tests-report-artifact: custom-report
    permissions:
      contents: read
      actions: write
