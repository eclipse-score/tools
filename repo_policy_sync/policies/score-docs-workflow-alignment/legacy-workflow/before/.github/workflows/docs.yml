name: Documentation
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
permissions:
  contents: write
  pages: write
  pull-requests: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo lint
  build-docs:
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@v0.0.2
    with:
      bazel-target: "--lockfile_mode=error //:docs"
      tests-report-artifact: custom-report
