title: "chore(devcontainer): sync standard SCORE tool launcher"
description: |
  Keep the SCORE devcontainer tool launcher in sync with the version maintained
  by eclipse-score/devcontainer.
values:
  devcontainer_version:
    type: dockerfile_image_version
    dockerfile: .devcontainer/Dockerfile
    image: ghcr.io/eclipse-score/devcontainer
when:
  file_exists: MODULE.bazel
  value_exists: devcontainer_version
ensure:
  - type: synchronize_file
    path: .devcontainer/run-tool
    source: run-tool
    executable: true
    rationale: Keep the launcher synchronized with the maintained devcontainer version.
