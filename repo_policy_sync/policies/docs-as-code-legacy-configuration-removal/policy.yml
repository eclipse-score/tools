title: "chore(docs): remove legacy score_docs_as_code configuration"
description: >
  Replace legacy documentation ignore entries and remove the obsolete docs/ubproject.toml configuration file.

when:
  bazel:
    direct_module_dependencies:
      - score_docs_as_code
ensure:
  - type: ensure_line
    path: .gitignore
    line: _build
    replace_line_globs:
      - "*_build*"
  - type: ensure_line
    path: .gitignore
    line: ubproject.toml
    replace_line_globs:
      - "*ubproject.toml*"
  - type: ensure_no_such_file
    path: docs/ubproject.toml
  - type: ensure_no_such_file
    path: ubproject.toml
