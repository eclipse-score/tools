title: "chore(bazel): keep the declared version at 8.6.0 or newer"
legacy_names: [bazel.minimum-version]
description: |
  Bazel versions older than `8.6.0` are no longer supported, due to a breaking
  change in how they handle `compatibility_level`.

when:
  file_exists: .bazelversion

ensure:
  - type: ensure_minimum_version
    path: .bazelversion
    minimum_version: 8.6.0

after_apply:
  - command: [bazel, mod, deps]
    when_file_exists: MODULE.bazel.lock
    when_path_changed: .bazelversion
    description: Regenerate MODULE.bazel.lock with `bazel mod deps`.
