title: "chore(bazel): require Bazel 8.6.0"
description: |
  Upgrade repositories using a Bazel release older than 8.6.0. Versions older
  than 8.6.0 are no longer supported, due to a breaking change.
ensure:
  - type: ensure_minimum_version
    path: .bazelversion
    minimum_version: 8.6.0
after_apply:
  - command: [bazel, mod, deps]
    when_file_exists: MODULE.bazel.lock
    description: Regenerate MODULE.bazel.lock with `bazel mod deps`.
