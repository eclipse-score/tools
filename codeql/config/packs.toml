# Pinned CodeQL artifacts. Keep in sync with MODULE.bazel, versions.bzl,
# reports.toml and README.md (a unit test enforces this).

[codeql_cli]
version = "2.27.4"

# Packs resolved from the CodeQL registry (downloaded) or shipped inside the
# pinned bundle. Every pack referenced from reports.toml must be listed here.
[packs]
"codeql/cpp-queries" = "1.10.0"
"codeql/cpp-all" = "12.4.0"
"codeql/cert-cpp-coding-standards" = "2.62.0"
"codeql/cert-c-coding-standards" = "2.62.0"
"codeql/misra-cpp-coding-standards" = "2.62.0"

# Packs that live in this repository (queries/*), found via --additional-packs.
[local]
"score/code-complexity-queries" = "1.0.0"
"score/codeql-sca-diagnostics" = "1.0.0"
