[project]
name = "monorepo-release"
version = "0.1.0"
description = "Review independently versioned components and draft GitHub releases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
monorepo-release = "monorepo_release.src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "src"]
sources = { "" = "monorepo_release" }
dev-mode-dirs = [".."]
