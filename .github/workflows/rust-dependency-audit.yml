name: Rust Dependency Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - "feat/**"
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      organization:
        description: "GitHub organization to audit"
        required: true
        default: "eclipse-score"
        type: string
      reference_repo:
        description: "Central source-of-truth score-crates repository"
        required: true
        default: "eclipse-score/score-crates"
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Audit Rust Dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run Rust Dependency Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${{ inputs.organization || 'eclipse-score' }}"
          REF_REPO="${{ inputs.reference_repo || 'eclipse-score/score-crates' }}"
          uv run score-rust-dependency-audit \
            --org "$ORG" \
            --reference-repo "$REF_REPO" \
            --output-dir public
          if [ -f "public/rust_dependency_audit.md" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat public/rust_dependency_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📦 Upload Audit Reports to Workflow Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-audit-reports
          path: public/
          retention-days: 30

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: audit
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
