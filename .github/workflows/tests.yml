on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - uses: castler/setup-bazel@cache-optimized
        with:
          bazelisk-cache: true
          disk-cache: integration_tests
          repository-cache: true
          cache-optimized: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      - name: ⚙️ Setup uv
        uses: astral-sh/setup-uv@v7
      # - name: Run python_basics integration tests
      #   run: |
      #     cd python_basics/integration_tests
      #     bazel test //...
      - name: Run Python tests
        run: uv run --locked pytest --ignore-glob='bazel-*'
      - name: Run Ruff quality checks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Build the Python wheel
        run: uv build --wheel
      - name: Smoke-test the installed Repository Policy Sync CLI
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv run --no-project --with "$wheel" score-copyright --help
          uv run --no-project --with "$wheel" score-repo-policy-sync --help
