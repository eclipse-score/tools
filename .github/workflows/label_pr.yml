name: PR Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      # Create labels for configured components without manual setup.
      issues: write
    steps:
      # Read configuration from the base branch without checking out PR code.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true
