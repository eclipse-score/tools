# The PR labels also serve as module prefixes for release tags.
cr-checker:
  - changed-files:
      - any-glob-to-any-file:
          - "cr_checker/**"
          - .pre-commit-hooks.yaml
          - MODULE.bazel

monorepo-release:
  - changed-files:
      - any-glob-to-any-file:
          - "monorepo_release/**"

repo-cache:
  - changed-files:
      - any-glob-to-any-file:
          - "repo_cache/**"

repo-policy-sync:
  - changed-files:
      - any-glob-to-any-file:
          - "repo_policy_sync/**"
          - .github/workflows/repo-policy-sync.yml

score-pytest:
  - changed-files:
      - any-glob-to-any-file:
          - "score_pytest/**"
          - MODULE.bazel
